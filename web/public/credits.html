<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مورد — مصادر صور المنتجات</title>
<style>body{margin:0;font:16px/1.7 system-ui,"IBM Plex Sans Arabic",sans-serif;background:#f7f6f3;color:#141a2b}main{max-width:820px;margin:auto;padding:24px 16px}h1{font-size:1.5rem;margin:0 0 4px}p{color:#5b6275}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}td,th{padding:10px 12px;border-bottom:1px solid #ebe8e2;text-align:start;font-size:14px}th{background:#eef2fe;color:#1d4ed8}a{color:#1d4ed8}.sku{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}</style></head>
<body><main><h1>مصادر صور المنتجات</h1><p>صور المنتجات صور حقيقية من مصادر حرة، فُرّغت خلفياتها وأُضيفت لها علامة مورد. تُستخدم وفق رخصها مع ذكر المصدر، والصورة المعدّلة متاحة بنفس الرخصة.</p>
<table><thead><tr><th>المنتج</th><th>المصدر</th><th>المؤلف</th><th>الرخصة</th></tr></thead><tbody id="rows"><tr><td colspan="4">جارٍ التحميل…</td></tr></tbody></table></main>
<script>
fetch('/credits.json').then(r=>r.json()).then(list=>{const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('rows').innerHTML=list.map(c=>`<tr><td class="sku">${e(c.sku)}</td><td><a href="${e(c.page)}" rel="noreferrer" target="_blank">${e(c.title||c.src)}</a></td><td>${e(c.author)}</td><td><a href="${e(c.licenseUrl)}" rel="noreferrer" target="_blank">${e(c.license)}</a></td></tr>`).join('')}).catch(()=>{document.getElementById('rows').innerHTML='<tr><td colspan="4">تعذّر التحميل</td></tr>'});
</script></body></html>
