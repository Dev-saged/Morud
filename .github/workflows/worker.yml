name: worker
on:
  push:
    paths: ['worker/**', 'spec/**', '.github/workflows/worker.yml']
  pull_request:
    paths: ['worker/**', 'spec/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
