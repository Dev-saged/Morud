name: spec
on:
  push:
    paths: ['spec/**', 'tests/**', 'brand/**', 'package.json', '.github/workflows/spec.yml']
  pull_request:
    paths: ['spec/**', 'tests/**', 'package.json']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
