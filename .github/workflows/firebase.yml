name: firestore-rules
on:
  push:
    paths: ['firebase/**', '.github/workflows/firebase.yml']
  pull_request:
    paths: ['firebase/**']
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
