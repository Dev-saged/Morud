# Android: اختبارات الوحدة + بناء APK موقّع ونشر Release على main (مكيّف من Dev-saged/android-template).
# التوقيع: KEYSTORE_BASE64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD
# الإعداد العام (ليس سراً): متغيرات المستودع MAWRED_API_URL و MAWRED_FIREBASE_API_KEY.
name: android
on:
  push:
    paths: ['android/**', 'spec/**', 'brand/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'spec/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      MAWRED_API_URL: ${{ vars.MAWRED_API_URL }}
      MAWRED_FIREBASE_API_KEY: ${{ vars.MAWRED_FIREBASE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Unit tests
        run: chmod +x ./gradlew && ./gradlew --no-daemon --stacktrace testDebugUnitTest
      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Collect APK
        run: |
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Mawred-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::warning::بلا أسرار توقيع — APK بمفتاح التطوير، لن يُنشر Release."; fi
          if [ -z "$MAWRED_API_URL" ] && ! grep -q '^mawred.apiUrl=https://' gradle.properties; then echo "::warning::عنوان الخادم غير مضبوط — التطبيق سيعرض «غير مهيأ» عند الدخول."; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Mawred-APK-${{ github.run_number }}
          path: android/dist/*.apk
          if-no-files-found: error
      - name: Publish release
        if: github.ref_name == 'main' && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}-b${GITHUB_RUN_NUMBER}"
          NOTES="../docs/releases/v${VERSION}.md"
          [ -f "$NOTES" ] || { echo "## مورد $VERSION" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          gh release create "$TAG" "dist/Mawred-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk" --title "مورد $VERSION — بناء $GITHUB_RUN_NUMBER" --notes-file "$NOTES" --target "$(git rev-parse HEAD)" --latest
