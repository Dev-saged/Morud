name = "mawred-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# القيم الحقيقية تُضبط لكل بيئة؛ الأسرار عبر: wrangler secret put SERVICE_ACCOUNT_JSON
[vars]
FIREBASE_PROJECT_ID = "mawred-staging"
ALLOWED_ORIGINS = "https://mawred-staging.pages.dev"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

[[r2_buckets]]
binding = "FILES"
bucket_name = "mawred-staging-files"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "mawred-staging-backups"

[env.production]
name = "mawred-api-prod"
vars = { FIREBASE_PROJECT_ID = "mawred-prod", ALLOWED_ORIGINS = "https://mawred.pages.dev" }
kv_namespaces = [{ binding = "KV", id = "REPLACE_WITH_PROD_KV_ID" }]
r2_buckets = [{ binding = "FILES", bucket_name = "mawred-prod-files" }, { binding = "BACKUPS", bucket_name = "mawred-prod-backups" }]

[triggers]
crons = ["* * * * *"]
