<!doctype html><html lang="ar"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.canvas{width:1600px;padding:70px 60px 80px}
.head{text-align:center;margin-bottom:54px;position:relative;z-index:2}
.head h2{font-size:46px;font-weight:800;margin:20px 0 12px}
.head p{font-size:22px;opacity:.75}
.row{display:flex;justify-content:center;gap:36px;position:relative;z-index:2;align-items:flex-start}
.row>div{width:var(--w,280px)}
.row>div:nth-child(even){margin-top:50px}
.row.desks{flex-wrap:wrap;gap:44px 40px}.row.desks>div{margin-top:0!important}
</style></head><body><div id="c" class="canvas"><div class="dots"></div><div class="head"><span class="eyebrow" id="eb"></span><h2 id="t"></h2><p id="s"></p></div><div class="row" id="r"></div></div>
<script>
const q=new URLSearchParams(location.search);const c=document.getElementById('c');c.classList.add(q.get('theme')||'paper');
eb.innerHTML='<i class="dot"></i>'+q.get('eb');t.textContent=q.get('t');s.textContent=q.get('s');
const kind=q.get('kind')||'phone';if(kind==='desk')r.classList.add('desks');document.documentElement.style.setProperty('--w',(q.get('w')||280)+'px');
for(const it of q.get('items').split(',')){const [img,cap]=it.split('|');const d=document.createElement('div');d.innerHTML=kind==="droid"?`<div class="phone droid"><div class="scr"><img src="${img}.png"></div></div>`:`<div class="${kind}"><img src="${img}.png"></div><div class="cap">${cap}</div>`;r.appendChild(d)}
</script></body></html>
